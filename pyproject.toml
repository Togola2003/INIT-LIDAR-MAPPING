[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-tp"
version = "0.1.0"
description = "TP Cartographie et localisation : outils LD06 (acquisition, visualisation, grid map, carte vectorielle)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "pyserial>=3.5", "customtkinter>=5.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
